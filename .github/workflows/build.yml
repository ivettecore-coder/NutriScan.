name: Build NutriScan APK

on:
  push:
    branches: [ "principal", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Source
        uses: actions/upload-artifact@v4
        with:
          name: NutriScan-App
          path: MainActivity.kt
